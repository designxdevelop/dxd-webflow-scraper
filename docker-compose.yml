version: "3.8"

# Local development only. Production uses PlanetScale Postgres; there is no Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dxd
      POSTGRES_PASSWORD: dxd
      POSTGRES_DB: scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxd -d scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
